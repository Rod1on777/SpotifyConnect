<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Glass Widget V4</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: transparent; color: white; overflow: hidden; }
        .widget { position: relative; display: flex; align-items: center; background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 15px; padding: 15px; width: 350px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); transition: opacity 0.5s ease; opacity: 0; }
        .cover { width: 60px; height: 60px; border-radius: 8px; margin-right: 15px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .info { display: flex; flex-direction: column; overflow: hidden; width: 100%; padding-right: 50px; }
        .title { font-size: 16px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 5px; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .artist { font-size: 14px; color: rgba(255, 255, 255, 0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); }
        .setup { background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 10px; width: 300px; }
        input, button { margin-top: 10px; padding: 10px; border-radius: 5px; border: none; width: 100%; box-sizing: border-box; }
        button { background: #1DB954; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1ed760; }
        .hidden { display: none !important; }
        
        /* Кнопки управления при наведении */
        .widget-controls { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.3s; }
        .widget:hover .widget-controls { opacity: 1; }
        .control-btn { width: 28px; height: 28px; background: rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.2); border-radius: 50%; color: white; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
        .control-btn:hover { background: rgba(0, 0, 0, 0.9); }
    </style>
</head>
<body>

<div id="setup" class="setup">
    <h3>Настройка Spotify</h3>
    <p style="font-size: 12px; color: #ccc; margin-bottom: 0;">1. Введите Client ID</p>
    <input type="text" id="clientId" placeholder="Ваш Client ID">
    
    <button onclick="startAuth()">Авторизоваться (для Chrome)</button>
    
    <div style="margin-top: 25px; border-top: 1px solid #444; padding-top: 15px;">
        <p style="font-size: 12px; color: #ccc; margin-bottom: 0;">2. Прямой вход (для OBS)</p>
        <input type="password" id="manualToken" placeholder="Вставьте Refresh Token">
        <button onclick="saveManualToken()" style="background: #555;">Войти по токену</button>
    </div>
</div>

<div id="widget" class="widget hidden">
    <img id="cover" class="cover" src="" alt="Cover">
    <div class="info">
        <div id="title" class="title">Загрузка...</div>
        <div id="artist" class="artist">Spotify</div>
    </div>
    
    <!-- Кнопки управления (появляются при наведении мыши) -->
    <div class="widget-controls">
        <button class="control-btn" onclick="togglePopup()" title="Скопировать токен">⚙️</button>
        <button class="control-btn" onclick="logout()" title="Выйти из аккаунта" style="background: rgba(200, 50, 50, 0.8);">🚪</button>
    </div>
    
    <div id="tokenPopup" class="hidden" style="position: absolute; top: 110%; left: 0; background: rgba(0,0,0,0.9); padding: 15px; border-radius: 10px; width: 100%; box-sizing: border-box; border: 1px solid #444; z-index: 10;">
        <p style="font-size: 12px; margin: 0 0 5px 0;">Refresh Token для OBS:</p>
        <input type="text" id="tokenDisplay" readonly style="width: 100%; padding: 8px; background: #222; color: #fff; border: 1px solid #555;">
        <button onclick="togglePopup()" style="margin-top: 10px; background: #555;">Закрыть</button>
    </div>
</div>

<script>
    const redirectUri = window.location.origin + window.location.pathname;
    const scopes = 'user-read-currently-playing';

    function generateRandomString(length) {
        let text = '';
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
        return text;
    }

    async function generateCodeChallenge(codeVerifier) {
        const encoder = new TextEncoder();
        const data = encoder.encode(codeVerifier);
        const digest = await window.crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode.apply(null, [...new Uint8Array(digest)])).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    async function startAuth() {
        const clientId = document.getElementById('clientId').value.trim();
        if (!clientId) return alert('Пожалуйста, введите Client ID');
        
        localStorage.setItem('spotify_client_id', clientId);
        const codeVerifier = generateRandomString(128);
        localStorage.setItem('spotify_code_verifier', codeVerifier);
        const codeChallenge = await generateCodeChallenge(codeVerifier);
        
        const args = new URLSearchParams({
            response_type: 'code',
            client_id: clientId,
            scope: scopes,
            redirect_uri: redirectUri,
            code_challenge_method: 'S256',
            code_challenge: codeChallenge
        });
        window.location = 'https://accounts.spotify.com/authorize?' + args;
    }

    async function getToken(code) {
        const codeVerifier = localStorage.getItem('spotify_code_verifier');
        const clientId = localStorage.getItem('spotify_client_id');
        if (!codeVerifier || !clientId) return logout();
        
        const body = new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            client_id: clientId,
            code_verifier: codeVerifier
        });

        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('spotify_access_token', data.access_token);
                localStorage.setItem('spotify_refresh_token', data.refresh_token);
                window.history.replaceState({}, document.title, redirectUri);
                checkNowPlaying();
            } else logout();
        } catch (e) { logout(); }
    }

    async function refreshToken() {
        const rToken = localStorage.getItem('spotify_refresh_token');
        const clientId = localStorage.getItem('spotify_client_id');
        if (!rToken || !clientId) return logout();

        const body = new URLSearchParams({
            grant_type: 'refresh_token',
            refresh_token: rToken,
            client_id: clientId
        });

        try {
            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: body
            });
            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('spotify_access_token', data.access_token);
                if (data.refresh_token) localStorage.setItem('spotify_refresh_token', data.refresh_token);
                checkNowPlaying();
            } else logout();
        } catch (e) { logout(); }
    }

    async function checkNowPlaying() {
        document.getElementById('setup').classList.add('hidden');
        document.getElementById('widget').classList.remove('hidden');
        
        const rToken = localStorage.getItem('spotify_refresh_token');
        if (rToken) document.getElementById('tokenDisplay').value = rToken;

        let accessToken = localStorage.getItem('spotify_access_token');
        
        try {
            let response = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': 'Bearer ' + accessToken }
            });

            if (response.status === 401) {
                await refreshToken();
                return;
            }

            if (response.status === 200) {
                const data = await response.json();
                if (data && data.item) {
                    document.getElementById('title').textContent = data.item.name;
                    document.getElementById('artist').textContent = data.item.artists.map(a => a.name).join(', ');
                    document.getElementById('cover').src = data.item.album.images[0].url;
                    document.getElementById('widget').style.opacity = '1';
                } else {
                    document.getElementById('widget').style.opacity = '0';
                }
            } else {
                document.getElementById('widget').style.opacity = '0';
            }
        } catch (error) {
            console.error(error);
        }

        setTimeout(checkNowPlaying, 3000);
    }

    function saveManualToken() {
        const clientId = document.getElementById('clientId'].value.trim();
        const token = document.getElementById('manualToken').value.trim();
        if (!clientId || !token) return alert('Введите Client ID и Refresh Token');
        localStorage.setItem('spotify_client_id', clientId);
        localStorage.setItem('spotify_refresh_token', token);
        refreshToken();
    }

    function logout() {
        localStorage.clear();
        document.getElementById('setup').classList.remove('hidden');
        document.getElementById('widget').classList.add('hidden');
        document.getElementById('widget').style.opacity = '0';
    }
    
    function togglePopup() {
        const popup = document.getElementById('tokenPopup');
        if (popup.classList.contains('hidden')) popup.classList.remove('hidden');
        else popup.classList.add('hidden');
    }

    window.onload = () => {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        
        if (code) {
            getToken(code);
        } else if (localStorage.getItem('spotify_refresh_token')) {
            refreshToken();
        }
    };
</script>
</body>
</html>
